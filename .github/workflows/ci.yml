name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: Driver / Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Test driver
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: cargo +"$TOOLCHAIN" test --locked
      - name: Formatting and Clippy
        if: matrix.rust == 'stable'
        run: |
          cargo +stable fmt --check
          cargo +stable fmt --manifest-path demo/Cargo.toml --check
          cargo +stable clippy --locked --all-targets -- -D warnings

  build:
    name: Build and run / Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2026-01-21 --profile minimal --component rust-src
      - name: Cache Cosmopolitan
        id: cosmo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cosmocc
          key: cosmocc-4.0.2-linux-x64-v1
      - name: Install Cosmopolitan for CI
        if: steps.cosmo-cache.outputs.cache-hit != 'true'
        run: bash ci/install-cosmocc.sh
      - name: Build driver and add tools to PATH
        run: |
          cargo +stable build --locked
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          echo "$PWD/.cosmocc/bin" >> "$GITHUB_PATH"
      - name: Preflight
        run: cargo cosmopolitan preflight
      - name: Build configurations
        run: python3 ci/build.py
      - name: Run all configurations on Linux x86-64
        run: python3 ci/smoke.py artifacts
      - name: Upload the same binaries for every runtime job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-demos
          path: artifacts/*.com
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Run portable binaries / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-demos
          path: artifacts
      - name: Run the Linux-built binaries on this OS and architecture
        run: python ci/smoke.py artifacts
